name: 构建 Accessories for MC 26.1.2
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 1 克隆已移植到 26.1 的源码
        run: |
          git clone --depth 1 --branch 26.1 https://github.com/roggy666/accessories-26.1.git src
          echo "java 文件数: $(find src -name '*.java' | wc -l)"

      - name: 2 改成目标 26.1.2
        run: |
          cd src
          cp libs.versions.toml /tmp/lv.orig
          cp gradle.properties /tmp/gp.orig
          sed -i '/org.gradle.java.home/d' gradle.properties
          sed -i 's|^minecraft = .*|minecraft = "26.1.2"|' libs.versions.toml
          sed -i 's|^minecraft_base = .*|minecraft_base = "26.1.2"|' libs.versions.toml
          sed -i 's|^fabric_api *=.*|fabric_api    = "0.155.3+26.1.2"|' libs.versions.toml
          sed -i 's|^owo_fabric *=.*|owo_fabric   = "0.13.1+26.1"|' libs.versions.toml

      - name: 3 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: 4 编译（先按 26.1.2，失败回退上游 26.1）
        run: |
          cd src
          chmod +x gradlew
          ./gradlew :fabric:build --no-daemon > /tmp/b1.log 2>&1 || R1=$?
          if [ -n "$R1" ]; then
            cp /tmp/lv.orig libs.versions.toml
            cp /tmp/gp.orig gradle.properties
            sed -i '/org.gradle.java.home/d' gradle.properties
            ./gradlew :fabric:build --no-daemon > /tmp/b2.log 2>&1 || R2=$?
          fi
          if [ -z "$R1" ]; then echo "✅ 26.1.2 配置构建成功" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          if [ -z "$R2" ]; then echo "✅ 回退到上游 26.1 配置构建成功（产物声明 ~26.1，26.1.2 可加载）" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo '## ❌ 构建失败（26.1.2 与回退 26.1 都没过）'
            echo ''
            echo '### 1. 失败的任务与原因'
            echo '```text'
            awk '/^FAILURE: Build failed/{f=1} f{print} /^\* Try:/{if(f)exit}' /tmp/b2.log | head -30
            echo '```'
            echo '### 2. 编译 / 依赖错误（前 60 条）'
            echo '```text'
            grep -hE 'error:|错误：|cannot find symbol|does not exist|Could not (find|resolve|determine|create)|Caused by:' /tmp/b2.log | head -60
            echo '```'
            echo '### 3. 日志尾部 20 行'
            echo '```text'
            tail -n 20 /tmp/b2.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: 5 上传 jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessories-fabric-26.1.2
          path: src/fabric/build/libs/*.jar
          if-no-files-found: warn
